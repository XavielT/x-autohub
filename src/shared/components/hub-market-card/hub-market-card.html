@if (isVehicle()) {
  <app-car-card [car]="item()" [priority]="priority()" />
} @else {
  <app-vehicle-card
    [link]="itemLink()" [image]="item().images.at(0) ?? null" [title]="item().title" [price]="item().price"
    [meta]="meta()" badge="De la comunidad" [square]="true" [isTest]="!!item().isTest"
    [priority]="priority()" />
}
