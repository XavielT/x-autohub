<app-vehicle-card
  [link]="'/auto-hub-details/' + autoHub().id" [image]="autoHub().images.at(0) ?? null"
  [title]="autoHub().brand + ' ' + autoHub().model" [price]="autoHub().price"
  [year]="autoHub().year" [mileage]="autoHub().mileage" [meta]="autoHub().location"
  badge="Verificado por X AutoHub" [specs]="specs()" [isTest]="!!autoHub().isTest"
  [priority]="priority()" />
