<app-vehicle-card
  [link]="link()" [image]="car().images.at(0) ?? null" [title]="title()" [price]="car().price"
  [year]="car().vehicleSpecs?.year ?? null" [mileage]="car().vehicleSpecs?.mileage ?? null"
  [meta]="meta()" badge="De la comunidad" [specs]="specs()" [isTest]="!!car().isTest"
  [priority]="priority()" />
