<form class="vf" (submit)="$event.preventDefault(); submit()">
  <div class="vf__field">
    <label [for]="idPrefix() + '-make'">Marca</label>
    <app-searchable-select [inputId]="idPrefix() + '-make'" [options]="makeOptions()"
      [value]="makeId()" (valueChange)="onMakeChange($event)" placeholder="Elige la marca" />
  </div>

  <div class="vf__field">
    <label [for]="idPrefix() + '-model'">Modelo</label>
    @if (freeModel()) {
      <input class="vf__text" type="text" maxlength="60" autocomplete="off"
        [id]="idPrefix() + '-model'" name="modelText" [value]="modelText()"
        (input)="onModelTextChange($any($event.target).value)"
        placeholder="Escribe el modelo, ej. Corolla" />
    } @else {
      <app-searchable-select [inputId]="idPrefix() + '-model'" [options]="modelOptions()"
        [value]="modelId()" (valueChange)="onModelChange($event)"
        [disabled]="makeId() === null || isLoadingModels()"
        [placeholder]="makeId() === null ? 'Primero la marca' : (isLoadingModels() ? 'Cargando…' : 'Elige el modelo')" />
    }
  </div>

  <div class="vf__field">
    <label [for]="idPrefix() + '-year'">Año</label>
    <app-searchable-select [inputId]="idPrefix() + '-year'" [options]="yearOptions"
      [value]="year()" (valueChange)="onYearChange($event)" [disabled]="!hasModel()"
      [placeholder]="!hasModel() ? 'Primero el modelo' : 'Elige el año'" />
  </div>

  <button type="submit" class="vf__submit" [disabled]="!isComplete()">{{ submitLabel() }}</button>

  @if (freeModel()) {
    <small class="vf__hint">Aún no tenemos los modelos de esta marca; escríbelo tú.</small>
  }
</form>
