<!-- Navbar -->
<div class="navbar" [class.navbar-mobile-open]="isMobileMenuOpen()">
    <div class="navbar-logo">
        <a routerLink="/">
            <app-logo-hub></app-logo-hub>
        </a>
    </div>
    <button class="navbar-mobile-toggle" type="button" aria-label="Abrir menu de navegacion"
        [attr.aria-expanded]="isMobileMenuOpen()" (click)="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="navbar-menu">
        <ul class="navbar-menu-list">
            <li class="navbar-menu-list-item">
                <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" #rlaHome="routerLinkActive"
                    (click)="closeMobileMenu()"> <img class="navbar-menu-list-item-icon"
                    [src]="rlaHome.isActive ? 'assets/icons/home-hub-icon.svg' : 'assets/icons/home-icon.svg'" alt="" aria-hidden="true"> Home</a>
            </li>
            <li class="navbar-menu-list-item">
                <a routerLink="/auto-hub" routerLinkActive="active" #rlaAutoHub="routerLinkActive" (click)="closeMobileMenu()"> <img
                        class="navbar-menu-list-item-icon" [src]="rlaAutoHub.isActive ? 'assets/icons/auto-hub-icon.svg' : 'assets/icons/auto-icon.svg'" alt="" aria-hidden="true">
                    Auto Hub</a>
            </li>
            <li class="navbar-menu-list-item">
                <a routerLink="/catalogo" routerLinkActive="active" #rlaCatalogo="routerLinkActive" (click)="closeMobileMenu()"> <img
                        class="navbar-menu-list-item-icon" [src]="rlaCatalogo.isActive ? 'assets/icons/cart-hub-icon.svg' : 'assets/icons/cart-icon.svg'" alt="" aria-hidden="true">
                    Catalogo</a>
            </li>
            <li class="navbar-menu-list-item">
                <a routerLink="/hub-market" routerLinkActive="active" #rlaMarket="routerLinkActive" (click)="closeMobileMenu()"> <img
                        class="navbar-menu-list-item-icon" [src]="rlaMarket.isActive ? 'assets/icons/market-hub-icon.svg' : 'assets/icons/market-icon.svg'" alt="" aria-hidden="true"> Hub
                    Market</a>
            </li>
            <li class="navbar-menu-list-item">
                <a routerLink="/servicios" routerLinkActive="active" #rlaServicios="routerLinkActive" (click)="closeMobileMenu()"> <img
                        class="navbar-menu-list-item-icon" [src]="rlaServicios.isActive ? 'assets/icons/services-hub-icon.svg' : 'assets/icons/services-icon.svg'" alt="" aria-hidden="true">Servicios</a>
            </li>
            <li class="navbar-menu-list-item">
                <a routerLink="/social-hub" routerLinkActive="active" #rlaSocial="routerLinkActive" (click)="closeMobileMenu()"> <img
                        class="navbar-menu-list-item-icon" [src]="rlaSocial.isActive ? 'assets/icons/network2-hub-icon.svg' : 'assets/icons/network2-icon.svg'" alt="" aria-hidden="true">
                    Social Hub</a>
            </li>
        </ul>
    </div>
    <div class="navbar-actions">
        @if (isLoggedIn()) {
            <span class="navbar-user" [title]="user()?.email">
                <span class="navbar-user-initial" aria-hidden="true">{{ user()?.displayName?.charAt(0) }}</span>
                <span class="navbar-user-name">{{ user()?.displayName }}</span>
            </span>
            @if (isAdmin()) {
                <a class="navbar-actions-button nav-button-secondary" routerLink="/admin"
                   (click)="closeMobileMenu()">
                    Panel
                </a>
            }
            <button class="navbar-actions-button nav-button-secondary" type="button" (click)="logout()">
                Salir
            </button>
        } @else {
            <a class="navbar-actions-button nav-button-secondary" routerLink="/login" (click)="closeMobileMenu()">
                Login
            </a>
        }
        <a class="navbar-actions-button nav-button-primary" routerLink="/publicar" (click)="closeMobileMenu()">
            Publicar
        </a>
    </div>
</div>
