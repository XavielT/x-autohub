<form class="pc" (submit)="$event.preventDefault(); publish()">
  <textarea class="pc__text" rows="3" [maxLength]="textMax" aria-label="¿Qué quieres compartir?"
            placeholder="¿Qué quieres compartir con la comunidad? Usa #etiquetas para que te encuentren."
            [ngModel]="text()" (ngModelChange)="text.set($event)" [ngModelOptions]="{ standalone: true }"></textarea>

  @if (previews().length > 0) {
    <ul class="pc__previews">
      @for (item of previews(); track item.file; let i = $index) {
        <li class="pc__preview">
          @if (item.url) {
            @if (item.isImage) {
              <img [src]="item.url" [alt]="'Foto ' + (i + 1)" />
            } @else {
              <video [src]="item.url" muted playsinline preload="metadata"></video>
            }
          }
          <button type="button" class="pc__remove" [attr.aria-label]="'Quitar el archivo ' + (i + 1)" (click)="remove(i)">×</button>
        </li>
      }
    </ul>
  }

  <div class="pc__bar">
    <label class="pc__attach" [class.pc__attach--off]="files().length >= mediaMax">
      Foto o video
      <input type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" multiple
             [disabled]="files().length >= mediaMax" (change)="onPick($event)" />
    </label>
    @if (isPreparing()) { <span class="pc__note" role="status">Optimizando…</span> }
    <span class="pc__count">{{ text().length }}/{{ textMax }}</span>
    <button type="submit" class="pc__submit" [disabled]="!canPublish()" [attr.aria-busy]="isPublishing()">
      Publicar
    </button>
  </div>
</form>
