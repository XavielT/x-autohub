<div class="accessory-details" *ngIf="accessory">
  <h1>{{accessory.title}}</h1>
  <img [src]="accessory.image" [alt]="accessory.title" />
  <p>{{accessory.description}}</p>
  <p>Precio: ${{accessory.price}}</p>
  <p>Vendedor: {{accessory.sellerName}}</p>
  <p>Ubicación: {{accessory.location}}</p>
</div>
