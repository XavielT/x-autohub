<div class="fit">
  @if (fitments().length === 0) {
    <p class="fit__empty">Sin vehiculos cargados. En la ficha dira "Consultar compatibilidad".</p>
  } @else {
    <ul class="fit__list">
      @for (f of fitments(); track $index) {
        <li class="fit__item">
          <span>{{ label(f) }}</span>
          <button type="button" class="fit__remove" [attr.aria-label]="'Quitar ' + label(f)"
                  (click)="remove($index)">×</button>
        </li>
      }
    </ul>
  }

  <div class="fit__add">
    <label class="fit__field">
      <span>Marca</span>
      <input type="text" list="fit-makes" autocomplete="off" placeholder="Toyota"
             [ngModel]="makeName()" (ngModelChange)="makeName.set($event)"
             [ngModelOptions]="{ standalone: true }" />
      <datalist id="fit-makes">
        @for (m of makes(); track m.id) { <option [value]="m.name"></option> }
      </datalist>
    </label>
    <label class="fit__field">
      <span>Modelo <small>(vacio = toda la marca)</small></span>
      <input type="text" list="fit-models" autocomplete="off" placeholder="Corolla"
             [disabled]="!selectedMake()"
             [ngModel]="modelName()" (ngModelChange)="modelName.set($event)"
             [ngModelOptions]="{ standalone: true }" />
      <datalist id="fit-models">
        @for (m of modelsOfSelected(); track m.id) { <option [value]="m.name"></option> }
      </datalist>
    </label>
    <label class="fit__field">
      <span>Desde <small>(ano)</small></span>
      <input type="number" inputmode="numeric" min="1900" max="2100" placeholder="2010"
             [ngModel]="yearFrom()" (ngModelChange)="yearFrom.set(parseYear($event))"
             [ngModelOptions]="{ standalone: true }" />
    </label>
    <label class="fit__field">
      <span>Hasta <small>(ano)</small></span>
      <input type="number" inputmode="numeric" min="1900" max="2100" placeholder="2020"
             [ngModel]="yearTo()" (ngModelChange)="yearTo.set(parseYear($event))"
             [ngModelOptions]="{ standalone: true }" />
    </label>
  </div>

  @if (error()) { <p class="fit__error" role="alert">{{ error() }}</p> }

  <button type="button" class="fit__add-btn" (click)="add()">+ Agregar vehiculo</button>
</div>
