@if (auto(); as auto) {
  <app-vehicle-detail
    [images]="images()" [title]="auto.brand + ' ' + auto.model" [location]="auto.location" [price]="auto.price"
    [specs]="specs()" [description]="auto.description" sellerName="X AutoHub" [contact]="contactDisplay()"
    [waLink]="waLink()" [isTest]="!!auto.isTest">
    @if (related().length > 0) {
      <section related class="related" aria-labelledby="related-title">
        <h2 class="related__title" id="related-title">Vehículos relacionados</h2>
        <div class="related__grid">
          @for (vehicle of related(); track vehicle.id) {
            <app-autohub-card [autoHub]="vehicle" />
          }
        </div>
      </section>
    }
  </app-vehicle-detail>
} @else if (isLoading()) {
  <app-skeleton variant="detail" label="Cargando el vehículo…" />
} @else {
  <div class="auto-hub-details__not-found">
    <h2>¡Ups! Vehículo no encontrado</h2>
    <span>Este vehículo ya no está disponible o fue borrado.</span>
    <img src="assets/icons/not-found-hub-icon.svg" alt="" />
  </div>
}
