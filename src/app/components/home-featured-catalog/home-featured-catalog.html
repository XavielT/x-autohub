<section class="featured-catalog">
    <span class="featured-catalog__label">Catalogo</span>
    <h3 class="featured-catalog__title">Piezas Destacadas</h3>
    <div class="featured-catalog__grid">
        @for (item of items(); track item.id){
            <div class="featured-catalog__cell featured-catalog__cell--{{ item.variant }}">
                <app-grid-catalog-card [item]="item"></app-grid-catalog-card>
            </div>
        }
    </div>
</section>
