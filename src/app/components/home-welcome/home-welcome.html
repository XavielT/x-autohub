<div class="home-container">
    <!--Animated Background-->
    <video class="home-bg-video" autoplay [muted]="true" loop playsinline preload="metadata" poster="assets/imgs/hero-poster.jpg">
        <source src="assets/videos/citroen-c3-flying.mp4" type="video/mp4">
    </video>

    <!--Overlay to make the bg darknes-->
    <div class="home-bg-overlay"></div>

    <!--Hero de la comunidad (antes era el hero del home)-->
    <div class="home-welcome-container">
        <div class="home-welcome-info-wrapper">
            <app-highlight-badge></app-highlight-badge>
            <div class="home-welcome-info">
                <h1>
                    <span class="home-welcome-title-line">LA ESCENA</span>&ngsp;<span class="home-welcome-title-line"><span class="welcome-info-highlight">AUTOMOTRIZ</span> DE RD</span>
                </h1>
                <p>Clubes, eventos y builds de la gente que vive los carros en República Dominicana.</p>
            </div>
            <div class="home-welcome-cta">
                <button type="button" class="hm-wlc-cta-btn home-welcome-cta-pri" (click)="viewClubs.emit()">
                    Ver clubes
                </button>
                <button type="button" class="hm-wlc-cta-btn home-welcome-cta-sec" (click)="viewEvents.emit()">
                    Ver eventos
                </button>
            </div>
        </div>
    </div>
</div>
