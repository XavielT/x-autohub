@if (counters(); as counters) {
    <div class="page-counter-overview">
        @for (counter of counters; track counter.label) {
            <div class="pg-cnt-container">
                <div class="pg-cnt-number">{{ counter.value }}</div>
                <div class="pg-cnt-info">
                    <h4>{{ counter.label }}</h4>
                    <span>{{ counter.caption }}</span>
                </div>
            </div>
        }
    </div>
}
