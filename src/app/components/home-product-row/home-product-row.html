<section class="hs" [class.hs--alt]="alt()" [attr.aria-label]="title()">
  <div class="hs__head">
    <div>
      <span class="hs__eyebrow">{{ eyebrow() }}</span>
      <h2 class="hs__title">{{ title() }}</h2>
    </div>
    <a class="hs__link" routerLink="/tienda">{{ linkLabel() }}</a>
  </div>

  <ul class="hrow" [class.hrow--carousel]="layout() === 'carousel'">
    @for (p of products(); track p.id; let i = $index) {
      <li class="hrow__item">
        <app-catalogo-card [hubPart]="p" [priority]="i < 2" />
      </li>
    }
  </ul>
</section>
